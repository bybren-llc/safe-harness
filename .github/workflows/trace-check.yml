name: Trace Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trace-validation:
    name: Requirements Trace Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify yq available
        run: |
          # Use runner's preinstalled yq
          if ! command -v yq &> /dev/null; then
            echo "❌ yq not found on runner"
            exit 1
          fi
          echo "✓ yq found: $(which yq)"
          yq --version

      - name: Validate trace map
        id: validate
        env:
          # Event fields only in env — never interpolate github.event.* in run: lines
          EVENT_NAME: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash trace/check.sh

      - name: Run trace/fixtures/run.sh
        run: |
          echo "Running fixture tests from trace/fixtures/run.sh..."
          bash trace/fixtures/run.sh

      - name: Run trace/test-fixtures.sh
        run: |
          echo "Running owner-identity fixture tests..."
          bash trace/test-fixtures.sh

      - name: Summary
        if: success()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Requirements trace validation passed"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
