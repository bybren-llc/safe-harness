name: Wave 0 Sanity Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  structure-check:
    name: Structure & Docs Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Validate required structure
        run: |
          echo "Checking required Wave 0 paths exist..."
          
          required_paths=(
            "constitution/README.md"
            "constitution/00-north-star.md"
            "constitution/01-round-table.md"
            "constitution/02-safe-ai-dlc.md"
            "constitution/03-cd-and-hitl.md"
            "constitution/04-privacy-and-vaults.md"
            "constitution/05-evidence-and-traceability.md"
            "constitution/06-empiricism.md"
            "roles/model-stack.md"
            "adapters/claude-code/README.md"
            "adapters/cursor/README.md"
            "prove/README.md"
            ".github/harness.yml"
          )
          
          missing=()
          for path in "${required_paths[@]}"; do
            if [[ ! -f "$path" ]]; then
              missing+=("$path")
              echo "❌ Missing: $path"
            else
              echo "✅ Found: $path"
            fi
          done
          
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo ""
            echo "ERROR: ${#missing[@]} required path(s) missing"
            exit 1
          fi
          
          echo ""
          echo "✅ All required paths present"
      
      - name: Validate harness config
        run: |
          echo "Checking .github/harness.yml config..."
          
          # Call the same validation script used by trace-check
          if bash trace/validate-trace.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.github/harness.yml" > /dev/null 2>&1; then
            echo "✅ Config valid: owner_identity is set and valid"
          else
            echo "❌ Config validation failed (see trace/validate-trace.sh for details)"
            bash trace/validate-trace.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.github/harness.yml"
            exit 1
          fi
      
      - name: Check markdown relative links
        run: |
          echo "Checking markdown files for broken relative links..."
          
          broken_links=0
          
          # Discover markdown files: root level + recursive under key directories.
          # skills/ is scanned warn-only by the skills-checks job. To make
          # skills/ blocking, add `skills` to this find list and remove
          # continue-on-error from the skills-checks link step.
          md_files=$(find . -maxdepth 1 -name "*.md" 2>/dev/null)
          md_files+=" "$(find constitution roles adapters templates prove trace -type f -name "*.md" 2>/dev/null)
          
          for md_file in $md_files; do
            echo "Checking: $md_file"
            
            # Extract inline markdown links [text](path.md) or [text](path/)
            # Use process substitution to avoid subshell counter issue
            while IFS= read -r link; do
              # Strip optional titles like [x](path.md "title")
              link="${link%% \"*}"
              link="${link%% \'*}"
              
              # Skip absolute URLs, anchors, and mailto
              if [[ "$link" =~ ^(https?://|#|mailto:) ]]; then
                continue
              fi
              
              # Resolve relative to the markdown file's directory
              dir=$(dirname "$md_file")
              target="$dir/$link"
              
              # Strip anchor fragments
              target_path="${target%%#*}"
              
              # Check if target exists (file or directory)
              if [[ ! -e "$target_path" ]]; then
                echo "  ❌ Broken link in $md_file: $link → $target_path"
                broken_links=$((broken_links + 1))
              fi
            done < <(grep -oP '\]\(\K[^)]+(?=\))' "$md_file" 2>/dev/null)
            
            # Extract reference-style link definitions [label]: path.md
            while IFS= read -r refline; do
              # Extract destination from [label]: destination or [label]: destination "title"
              link=$(echo "$refline" | sed -E 's/^\[([^]]+)\]:[[:space:]]*([^[:space:]"]+).*/\2/')
              
              # Skip absolute URLs, anchors, and mailto
              if [[ "$link" =~ ^(https?://|#|mailto:) ]]; then
                continue
              fi
              
              # Resolve relative to the markdown file's directory
              dir=$(dirname "$md_file")
              target="$dir/$link"
              
              # Strip anchor fragments
              target_path="${target%%#*}"
              
              # Check if target exists (file or directory)
              if [[ ! -e "$target_path" ]]; then
                echo "  ❌ Broken reference-style link in $md_file: $link → $target_path"
                broken_links=$((broken_links + 1))
              fi
            done < <(grep -P '^\[[^]]+\]:[[:space:]]+[^[:space:]]+' "$md_file" 2>/dev/null)
          done
          
          if [[ $broken_links -gt 0 ]]; then
            echo ""
            echo "ERROR: Found $broken_links broken relative link(s)"
            exit 1
          fi
          
          echo ""
          echo "✅ No broken relative links detected"
      
      - name: Validate markdown syntax
        run: |
          echo "Basic markdown syntax validation..."
          
          # Check for common markdown issues
          issues=0
          
          for md_file in $(find . -name "*.md" -not -path "./.git/*" 2>/dev/null); do
            # Check for unclosed code fences (Wave 0 uses simple parity count; does not detect nested fence-like content)
            fence_count=$(grep -c '^```' "$md_file" 2>/dev/null || printf "0")
            if [[ $((fence_count % 2)) -ne 0 ]]; then
              echo "❌ Unclosed code fence in: $md_file"
              issues=$((issues + 1))
            fi
          done
          
          if [[ $issues -gt 0 ]]; then
            echo ""
            echo "ERROR: Found $issues markdown syntax issue(s)"
            exit 1
          fi
          
          echo "✅ Basic markdown syntax valid"
      
      - name: Check for merge conflict markers
        run: |
          bash scripts/check-conflict-markers.sh
      
      - name: Summary
        if: success()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Wave 0 sanity checks passed"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  # Warn-only skills checks (#37). Findings do not fail the workflow.
  # Flip to blocking: see docs/ci/skills-checks.md
  skills-checks:
    name: Skills frontmatter & link scan (warn-only)
    runs-on: ubuntu-latest
    env:
      PYYAML_VERSION: "6.0.3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PyYAML (pinned)
        continue-on-error: true
        run: |
          echo "Installing PyYAML==${PYYAML_VERSION} (pinned)"
          python3 -m pip install --user --break-system-packages "PyYAML==${PYYAML_VERSION}"
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"

      - name: Check skills frontmatter
        # WARN-ONLY. To flip to blocking, remove continue-on-error below.
        continue-on-error: true
        run: |
          if [[ ! -f skills/check-frontmatter.py ]]; then
            echo "skills/check-frontmatter.py not present — skipping frontmatter check"
            exit 0
          fi
          echo "Running python3 skills/check-frontmatter.py (warn-only)"
          python3 skills/check-frontmatter.py

      - name: Check markdown relative links in skills/
        # WARN-ONLY. To flip to blocking, remove continue-on-error below
        # and add `skills` to the structure-check find list.
        continue-on-error: true
        run: |
          echo "Checking skills/ markdown files for broken relative links (warn-only)..."

          broken_links=0

          # Same scan as structure-check, extended to skills/.
          md_files=$(find skills -type f -name "*.md" 2>/dev/null)

          for md_file in $md_files; do
            echo "Checking: $md_file"

            while IFS= read -r link; do
              link="${link%% \"*}"
              link="${link%% \'*}"

              if [[ "$link" =~ ^(https?://|#|mailto:) ]]; then
                continue
              fi

              dir=$(dirname "$md_file")
              target="$dir/$link"
              target_path="${target%%#*}"

              if [[ ! -e "$target_path" ]]; then
                echo "  ❌ Broken link in $md_file: $link → $target_path"
                broken_links=$((broken_links + 1))
              fi
            done < <(grep -oP '\]\(\K[^)]+(?=\))' "$md_file" 2>/dev/null)

            while IFS= read -r refline; do
              link=$(echo "$refline" | sed -E 's/^\[([^]]+)\]:[[:space:]]*([^[:space:]"]+).*/\2/')

              if [[ "$link" =~ ^(https?://|#|mailto:) ]]; then
                continue
              fi

              dir=$(dirname "$md_file")
              target="$dir/$link"
              target_path="${target%%#*}"

              if [[ ! -e "$target_path" ]]; then
                echo "  ❌ Broken reference-style link in $md_file: $link → $target_path"
                broken_links=$((broken_links + 1))
              fi
            done < <(grep -P '^\[[^]]+\]:[[:space:]]+[^[:space:]]+' "$md_file" 2>/dev/null)
          done

          if [[ $broken_links -gt 0 ]]; then
            echo ""
            echo "WARN: Found $broken_links broken relative link(s) under skills/"
            exit 1
          fi

          echo ""
          echo "✅ No broken relative links detected under skills/"

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Skills checks are warn-only and do not block merge."
          echo "To flip to blocking, see docs/ci/skills-checks.md"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
