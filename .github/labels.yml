  - name: needs-owner-concur
    color: "d93f0b"
    description: "Awaiting owner concurrence (required for intent/spec/constitution PRs)"

  # Risk tiers
  - name: "tier:low"
    color: "c2e0c6"
    description: "Risk tier: Low (auto-merge when green)"
  
  - name: "tier:medium"
    color: "f9d0c4"
    description: "Risk tier: Medium (one human decision pack)"
  
  - name: "tier:high"
    color: "d73a4a"
    description: "Risk tier: High (two distinct humans recommended, not a gate)"

  # O2 high-risk items (default High unless downgraded)
  - name: "o2:pricing"
    color: "b60205"
    description: "O2 high-risk: pricing"
  
  - name: "o2:refunds"
    color: "b60205"
    description: "O2 high-risk: refunds"
  
  - name: "o2:auth"
    color: "b60205"
    description: "O2 high-risk: auth"
  
  - name: "o2:deploy-ci"
    color: "b60205"
    description: "O2 high-risk: deploy CI/workflows"
  
  - name: "o2:secrets"
    color: "b60205"
    description: "O2 high-risk: prod secrets"
  
  - name: "o2:privacy"
    color: "b60205"
    description: "O2 high-risk: privacy-boundary crosses"

  # Exit states
  - name: "exit:qas"
    color: "5319e7"
    description: "Exit state: Ready for QAS"
  
  - name: "exit:rte"
    color: "5319e7"
    description: "Exit state: Approved for RTE"
  
  - name: "exit:hitl"
    color: "5319e7"
    description: "Exit state: Ready for HITL"
  
  - name: "exit:merged"
    color: "0e8a16"
    description: "Exit state: MERGED (HITL only) — Owner executed. Repo label sync is a post-merge step."
  
  - name: "exit:merged-delegated"
    color: "0e8a16"
    description: "Exit state: MERGED (HITL-delegated, Low tier only)"

  - name: "exit:merged-rte"
    color: "0e8a16"
    description: "Exit state: MERGED (delegated QAS/RTE) — QAS or Release · RTE executed under constitution/03"

  # Gate labels (wave workflow stages)
  - name: "gate:rnd"
    color: "bfd4f2"
    description: "Gate: Research & Discover"
  
  - name: "gate:plan"
    color: "bfd4f2"
    description: "Gate: Plan"
  
  - name: "gate:concur"
    color: "fbca04"
    description: "Gate: Concurrence (awaiting approval)"
  
  - name: "gate:execute"
    color: "0e8a16"
    description: "Gate: Execute (implementation)"
  
  - name: "gate:measure"
    color: "5319e7"
    description: "Gate: Measure (outcomes vs. metrics)"

  # Link health (Librarian · Signals)
  - name: link-rot
    color: "e99695"
    description: "Broken or stale link found by the Librarian link-health scan"
