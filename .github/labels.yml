# Documentation-only. Do not create these labels via API during Wave 1.
# Manual creation or automation comes after owner concurrence.
#
# Milestones: One milestone per wave (e.g., "Wave 1", "Wave 2").
# Document milestones; create them manually or via approved automation.
#
# Label scheme:
#   bolt             - Bolt/UoW work items (spine A)
#   tier:low         - Risk tier: Low
#   tier:medium      - Risk tier: Medium
#   tier:high        - Risk tier: High
#   requirement      - Requirement definition or state change
