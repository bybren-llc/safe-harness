labels:
  # Work item types
  - name: bolt
    color: "0e8a16"
    description: "Bolt / Unit of Work (spine A: Delivery)"
  
  - name: requirement
    color: "1d76db"
    description: "Requirement definition or state change"
  
  - name: decision
    color: "d93f0b"
    description: "Decision requiring explicit decision concurrence (not design ownership)"
  
  - name: needs-concur
    color: "fbca04"
