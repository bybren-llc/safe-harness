# Trace Map — safe-harness
#
# Canonical requirement state tracking and evidence linkage.
# Path: trace/trace-map.yaml (fixed)
# Schema: trace/schema.md
# Enforced by: .github/workflows/trace-check.yml
#
# Bootstrap rule (Wave 1): CI runs warn-only until first spec.md with REQ IDs lands,
# then becomes blocking. See constitution/05 for details.

